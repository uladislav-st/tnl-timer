name: Build and publish Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read application version
        id: app
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create release tag
        shell: bash
        run: |
          tag="v${{ steps.app.outputs.version }}"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "Release $tag belongs to another commit. Increase package.json version before pushing to main."
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Build and publish GitHub Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
